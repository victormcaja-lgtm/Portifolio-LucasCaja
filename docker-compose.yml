# Postgres local de desenvolvimento (TASK-04).
# Porta 5434 no host para não colidir com outros Postgres locais (5432/5433).
# Credenciais lidas do `.env` (padrões abaixo valem só para desenvolvimento).
services:
  db:
    image: postgres:16-alpine
    container_name: portfolio-lucascaja-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executado só na primeira inicialização do volume: cria o banco `portfolio_test`.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
